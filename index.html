<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <!-- 这一句是适应手机端的核心 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HJJ练习作品</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ====== 全屏动画遮罩层 ====== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FFC0CB;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 1.5s ease-in-out 2.5s forwards;
        }

        .hidden { display: none !important; }

        .my-logo { width: 500px; }

        .my-logo svg { overflow: visible; }

        .line-animation {
            stroke-dasharray: 100 100;
            stroke-dashoffset: 100;
            animation: drawLine 2s ease-in-out forwards;
        }

        @keyframes drawLine {
            0% { stroke-dashoffset: 100; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* ====== 手机端适配 (屏幕宽度小于768px时生效) ====== */
        @media (max-width: 768px) {
            .my-logo { 
                width: 80% !important; /* 手机端缩小开场动画 */
            }
            
            img {
                max-width: 100px !important; /* 防止头像在手机上过大 */
                height: auto !important;
            }

            /* 调整中间文字区的内边距 */
            .content-box {
                padding: 20px 15px !important; 
            }

            /* 调整底部区域的内边距 */
            .footer-box {
                padding: 40px 20px !important; 
            }
        }
    </style>
</head>
<body>

    <!-- 全屏开场动画 -->
    <div id="loading-screen">
        <div class="my-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 191.88 76.56">
                <path class="line-animation"
                    d="M37.94.5C16.44.5.5,17,.5,40c0,17.5,16.69,35.88,38.81,35.88,20.63,0,34.38-15.38,56.88-37.38C116.44,18.7,131.69.75,153.94.75c21,0,37.44,16.5,37.44,37.75,0,19-16.69,37.56-38.81,37.56C135,76.06,118.71,60,96.51,38.56,74.94,17.75,58.69.5,37.94.5Z"
                    fill="none" stroke="#E0FFFF" stroke-width="10" pathLength="100" />
            </svg>
        </div>
    </div>

    <!-- 粉色头部 -->
    <div style="background-color:#FFC0CB; text-align:center; padding:60px 20px;">
        <img src="Nikki.png" alt="苏暖暖" width="120" height="100">
    </div>

    <!-- 灰色内容区（加了 class="content-box" 方便手机端调整） -->
    <div class="content-box" style="max-width:700px; text-align:center; background-color:#FDF5E6; margin:30px auto; padding:15px; line-height:1.7; color:#66CDAA; border-radius: 10px;">
       <p>出场动画参考了</p>
       <a href="https://dark.netflix.io/en/family-tree">德剧：《暗黑》</a>
       <p>反正我觉得挺好看的</p>
       <p>故事是关于时间时空的</p>
       <p>不过看的时候我一直在思考祖母悖论</p>
       <p>没看完，德剧太难啃了</p>
       <p>人物多到我对着关系树都没看明白</p>
    </div>

    <!-- 底部（加了 class="footer-box"） -->
    <div class="footer-box" style="background-color:#FFC0CB; text-align:center; padding:60px 20px; font-size:14px;">
        <p>个人练习作品</p>
        <a href="https://www.runoob.com/html/html-tutorial.html" style="color: #333; text-decoration: none;">学习链接</a>
      <br><br>
        <a href="可乐鸡翅.pdf" style="color: #333; text-decoration: none;">略拼小力的大作业</a>
    </div>

    <!-- 音乐 -->
    <audio id="bg-music" loop autoplay muted>
        <source src="Lion.wav" type="audio/wav">
    </audio>

    <button id="music-btn" onclick="toggleMusic(event)" style="display: none; position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; border-radius: 20px; background: #FFB6C1; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10000;">
        🎵
    </button>

    <script>
        var audio = document.getElementById('bg-music');
        var btn = document.getElementById('music-btn');
        var hasInteracted = false;

        function toggleMusic(event) {
            event.stopPropagation();
            if (audio.paused) {
                audio.muted = false;
                audio.play();
                btn.innerHTML = '⏸️';
            } else {
                audio.pause();
                btn.innerHTML = '🎵';
            }
            hasInteracted = true;
        }

        document.addEventListener('click', function() {
            if (!hasInteracted) {
                audio.muted = false; 
                audio.play();        
                btn.innerHTML = '⏸️'; 
                hasInteracted = true;
            }
        });

        setTimeout(function() {
            btn.style.display = 'block';
        }, 3000); 

        setTimeout(function() {
            document.getElementById('loading-screen').classList.add('hidden');
        }, 4500);
    </script>
</body>
</html>
